# These are the harness versions clutch's conformance suite (`clutch conform`) pins. The suite skips
# a harness at any other version unless --any-version is passed, so keep them in step with the pins
# in clutch/internal/app/harnesses.go.
#
# Claude Code is absent because it is a native install, which the driver keeps from updating itself
# (DISABLE_AUTOUPDATER), so the version on the PATH is the one the suite sees.
[tools]
pi = "0.99.2"
opencode = "1.18.34"

# The check builds, vets, format-checks, and race-tests every module in go.work. It is hermetic:
# no test reaches a router, a harness, or the network, and it writes nothing.
[tasks.check]
description = "Build, vet, format-check, and race-test every go.work module; writes nothing"
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
for mod in $(go work edit -json | jq -r '.Use[].DiskPath'); do
  echo "check: $mod"
  (
    cd "$mod"
    go build ./...
    go vet ./...
    unformatted=$(gofmt -l .)
    if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
    go test -race ./...
  )
done
'''
